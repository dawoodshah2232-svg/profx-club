<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistance — ProFX Club CRM</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css?v=20260930b">
</head>
<body data-page="assistance">
<header class="nav"><div class="container nav-inner">
<a class="logo" href="index.html" aria-label="ProFX Club — Admin CRM"><img class="logo-img" src="../assets/logo-shield.png" alt="ProFX Club"><span class="logo-sub">Admin CRM</span></a>
</div></header>

<div class="app">
  <aside class="side" id="adminSide"></aside>
  <div class="main">
    <div class="demo-banner"><b>DEMO DATA</b> — sample request labelled SAMPLE. Support records are private to authorised staff; access is logged.</div>
    <div class="page-head"><div><h1>Assistance requests</h1><p class="lead">Workflow: new → reviewing → awaiting member → referral offered → referred → resolved → closed.</p></div></div>
    <div class="toolbar">
      <select id="fStatus"><option value="">All statuses</option><option>new</option><option>reviewing</option><option>awaiting member</option><option>referral offered</option><option>referred</option><option>resolved</option><option>closed</option></select>
    </div>
    <div id="msg"></div>
    <div id="list"></div>
    <div id="detail" style="display:none"></div>
  </div>
</div>

<script src="../js/db.js?v=20260930b"></script>
<script src="../js/admin.js?v=20260930b"></script>
<script>
(function () {
  "use strict";
  var FLOW = ["new", "reviewing", "awaiting member", "referral offered", "referred", "resolved", "closed"];
  function render() {
    var fs = document.getElementById("fStatus").value;
    var rows = PFX.db.assistance.filter(function (a) { return !fs || a.status === fs; })
      .sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
    document.getElementById("list").innerHTML = rows.length ? rows.map(function (a) {
      var m = PFX.memberById(a.memberId);
      return '<div class="list-row"><div class="grow"><h3>' + PFX.esc(a.category) + ' — ' + PFX.esc(a.provider) + (a.sample ? ' <span class="badge badge-demo">SAMPLE</span>' : "") + '</h3>' +
        '<p class="meta">' + PFX.esc(m ? m.name : a.memberId) + ' · ' + PFX.esc(a.country) + ' · opened ' + PFX.fmtDate(a.createdAt) + '</p>' +
        '<span class="badge badge-info">' + PFX.esc(a.status) + '</span></div>' +
        '<button class="btn btn-ghost btn-sm" data-open="' + a.id + '">Open case</button></div>';
    }).join("") : '<div class="empty">No requests in this state.</div>';
  }
  function open(id) {
    var a = PFX.db.assistance.find(function (x) { return x.id === id; });
    if (!a) return;
    ADM.viewSensitive("assistance", id);
    var m = PFX.memberById(a.memberId);
    document.getElementById("list").style.display = "none";
    var d = document.getElementById("detail"); d.style.display = "block";
    d.innerHTML = '<button class="btn btn-ghost btn-sm" id="dBack">← All requests</button>' +
      '<div class="card" style="margin-top:.8rem"><div class="page-head"><div><h3>' + PFX.esc(a.category) + ' — ' + PFX.esc(a.provider) + '</h3>' +
      '<p class="meta">' + PFX.esc(m ? m.name + " (" + m.email + ")" : a.memberId) + ' · ' + PFX.esc(a.country) + ' · contact pref: ' + PFX.esc(a.contactPref) + '</p></div>' +
      '<select id="dStatus" style="width:auto">' + FLOW.map(function (s) { return '<option' + (a.status === s ? " selected" : "") + '>' + s + '</option>'; }).join("") + '</select></div>' +
      '<dl class="kv"><dt>Brief facts</dt><dd>' + PFX.esc(a.facts) + '</dd><dt>Dates</dt><dd>' + PFX.esc(a.dates || "—") + '</dd><dt>Requested help</dt><dd>' + PFX.esc(a.requestedHelp) + '</dd>' +
      '<dt>Referral consent</dt><dd>' + (a.referralConsent ? "✅ granted " + PFX.fmtDate(a.referralConsent.at) : "not granted") + '</dd></dl>' +
      '<h4 style="margin:1rem 0 .5rem">Messages</h4><div class="timeline">' +
      (a.messages || []).map(function (mm) {
        return '<div><b>' + (mm.from === "staff" ? "Support" : "Member") + '</b> <span class="meta">' + PFX.fmtDate(mm.at) + '</span><br>' + PFX.esc(mm.text) + '</div>';
      }).join("") + '</div>' +
      '<div class="field"><label for="dReply">Reply to member (private)</label><textarea id="dReply" style="min-height:80px"></textarea></div>' +
      '<button class="btn btn-primary btn-sm" id="dSend">Send reply</button>' +
      '<h4 style="margin:1rem 0 .5rem">Private staff notes</h4>' +
      (a.privateNotes || []).map(function (n) { return '<p class="meta">• ' + PFX.fmtDate(n.at) + ' — ' + PFX.esc(n.text) + '</p>'; }).join("") +
      '<div style="display:flex;gap:.5rem;margin-top:.5rem"><input type="text" id="dNote" placeholder="Add private note (staff only)"><button class="btn btn-ghost btn-sm" id="dNoteBtn">Add note</button></div>' +
      '<h4 style="margin:1rem 0 .5rem">Access &amp; status history</h4>' +
      (a.history || []).map(function (h) { return '<p class="meta">• ' + PFX.fmtDate(h.at) + ' — ' + PFX.esc(h.by) + ': ' + PFX.esc(h.action) + '</p>'; }).join("") +
      '</div>';
    document.getElementById("dBack").addEventListener("click", function () { d.style.display = "none"; document.getElementById("list").style.display = "block"; render(); });
    document.getElementById("dStatus").addEventListener("change", function (ev) {
      var from = a.status; a.status = ev.target.value;
      a.history.push({ at: PFX.now(), by: "admin", action: "status " + from + " → " + a.status });
      PFX.save(); PFX.audit("assistance.status", a.id + " " + from + " → " + a.status, "admin");
      document.getElementById("msg").innerHTML = '<div class="success">Status updated to ' + PFX.esc(a.status) + '.</div>';
    });
    document.getElementById("dSend").addEventListener("click", function () {
      var t = document.getElementById("dReply").value.trim(); if (!t) return;
      a.messages.push({ at: PFX.now(), from: "staff", text: t });
      a.history.push({ at: PFX.now(), by: "admin", action: "replied to member" });
      PFX.save(); PFX.audit("assistance.staff_reply", a.id, "admin");
      open(id);
    });
    document.getElementById("dNoteBtn").addEventListener("click", function () {
      var t = document.getElementById("dNote").value.trim(); if (!t) return;
      a.privateNotes.push({ at: PFX.now(), by: "admin", text: t });
      a.history.push({ at: PFX.now(), by: "admin", action: "private note added" });
      PFX.save(); PFX.audit("assistance.note", a.id, "admin");
      open(id);
    });
  }
  document.getElementById("fStatus").addEventListener("change", render);
  document.addEventListener("click", function (ev) { var o = ev.target.closest("[data-open]"); if (o) open(o.dataset.open); });
  render();
})();
</script>
</body>
</html>
