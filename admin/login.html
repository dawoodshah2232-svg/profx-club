<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ProFX Club CRM</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css?v=20261005">
</head>
<body data-page="admin-login">
<header class="nav"><div class="container nav-inner">
<a class="logo" href="../index.html" aria-label="ProFX Club — Admin CRM"><img class="logo-img" src="../assets/logo-full.png" alt="ProFX Club"><span class="logo-sub">Admin CRM</span></a>
</div></header>

<main class="auth-wrap">
  <div class="auth-card">
    <img class="auth-logo" src="../assets/logo-full.png" alt="ProFX Club logo" width="64" height="78">
    <p class="auth-brand">ProFX Club · CRM</p>
    <h1>Admin sign in</h1>
    <p class="auth-sub">Staff access to the member CRM. All admin actions are logged.</p>

    <button class="btn btn-navy btn-lg auth-demo" id="demoGo">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="stroke:#fff;fill:none;stroke-width:2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Sign in as demo admin
    </button>
    <p class="auth-demo-note">One click — full CRM access with sample data.</p>

    <div class="auth-divider"><span>or sign in with PIN</span></div>

    <div class="demo-banner"><b>DEMO AUTH</b> — PIN login only. Production will use proper staff accounts with roles.</div>
    <div class="form-error" id="lErr" role="alert"></div>
    <div class="field"><label for="lPin">Admin PIN</label>
      <input type="password" id="lPin" class="auth-input auth-code-input" inputmode="numeric" autocomplete="off" placeholder="••••••">
    </div>
    <button class="btn btn-outline auth-btn" id="lGo" style="width:100%">Sign in to CRM</button>
    <p class="form-note" style="text-align:center">Demo PIN is published in <b>README.md</b>.</p>
  </div>
</main>

<script src="../js/db.js?v=20261005"></script>
<script>
(function () {
  "use strict";
  var PIN = "246810"; /* demo PIN — see README.md */
  function err(m) { var e = document.getElementById("lErr"); e.textContent = m; e.style.display = "block"; }
  document.getElementById("lGo").addEventListener("click", function () {
    if (document.getElementById("lPin").value.trim() === PIN) {
      sessionStorage.setItem("profx_admin", JSON.stringify({ at: PFX.now() }));
      PFX.audit("admin.login", "PIN login", "admin");
      location.href = "index.html";
    } else err("Incorrect PIN. See README.md for the demo PIN.");
  });
  document.getElementById("lPin").addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("lGo").click(); });
  document.getElementById("demoGo").addEventListener("click", function () {
    sessionStorage.setItem("profx_admin", JSON.stringify({ at: PFX.now() }));
    PFX.audit("admin.login", "demo one-click", "admin");
    location.href = "index.html";
  });
})();
</script>
</body>
</html>
