<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit log — ProFX Club CRM</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css?v=20261004">
</head>
<body data-page="audit">
<header class="nav"><div class="container nav-inner">
<a class="logo" href="index.html" aria-label="ProFX Club — Admin CRM"><img class="logo-img" src="../assets/logo-lockup.png" alt="ProFX Club"><span class="logo-sub">Admin CRM</span></a>
</div></header>

<div class="app">
  <aside class="side" id="adminSide"></aside>
  <div class="main">
    <div class="page-head"><div><h1>Audit log</h1><p class="lead">Every sensitive access and change, newest first. Kept to the last 500 entries.</p></div></div>
    <div class="toolbar"><input type="search" id="q" placeholder="Search action, actor, detail…"></div>
    <div id="list"></div>
  </div>
</div>

<script src="../js/db.js?v=20261004"></script>
<script src="../js/admin.js?v=20261004"></script>
<script>
(function () {
  "use strict";
  function render() {
    var q = document.getElementById("q").value.trim().toLowerCase();
    var rows = PFX.db.audit.filter(function (a) {
      return !q || (a.action + " " + a.actor + " " + (a.detail || "")).toLowerCase().indexOf(q) > -1;
    });
    document.getElementById("list").innerHTML = rows.length
      ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Detail</th></tr></thead><tbody>' +
        rows.map(function (a) {
          return "<tr><td class='meta'>" + PFX.fmtDate(a.at) + "</td><td><b>" + PFX.esc(a.action) + "</b></td><td class='meta'>" + PFX.esc(a.actor) + "</td><td class='meta'>" + PFX.esc(a.detail || "") + "</td></tr>";
        }).join("") + "</tbody></table></div>"
      : '<div class="empty">No audit entries match.</div>';
  }
  document.getElementById("q").addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
